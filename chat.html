<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Chat — R.Reial</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet"><style>body{background:#09090b;color:white;font-family:system-ui,sans-serif}.medieval{font-family:'UnifrakturCook',cursive}.glass{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12)}</style></head>
<body><nav class="border-b border-white/10 bg-zinc-950"><div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4"><a href="index.html" class="flex items-center gap-3"><img src="targaryen-crest.png" class="h-10 w-10 rounded-2xl object-cover" alt="Dragon crest"><span class="medieval text-2xl">R.Reial</span></a><div class="flex gap-4 text-sm"><a href="about.html">About</a><a href="vibes.html">Vibes</a><a href="contact.html">Contact</a><a href="chat.html" class="text-red-300">Chat</a></div></div></nav>
<main class="mx-auto max-w-3xl px-6 py-12"><div class="mb-8 text-center"><span class="text-xs font-semibold tracking-[.3em] text-indigo-300">THE DRAGON'S DEN</span><h1 class="medieval mt-3 text-5xl sm:text-7xl">Live chat</h1><p class="mt-3 text-white/60">Keep it kind. No hoarding all the good memes.</p></div><section class="glass overflow-hidden rounded-3xl"><div id="status" class="border-b border-white/10 px-5 py-3 text-center text-sm text-white/50">Connecting to the Dragon's Den…</div><div id="messages" class="h-[420px] space-y-4 overflow-y-auto p-5" aria-live="polite"></div><form id="chat-form" class="border-t border-white/10 p-4"><div class="mb-3 flex gap-3"><input id="name" maxlength="28" required placeholder="Your dragon name" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/35 focus:border-red-400"><button type="button" id="save-name" class="rounded-xl border border-white/15 px-4 text-sm hover:bg-white/10">Save</button></div><div class="flex gap-3"><input id="message" maxlength="500" required placeholder="Send a message…" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 outline-none placeholder:text-white/35 focus:border-red-400"><button class="rounded-xl bg-white px-5 font-semibold text-zinc-950">Send</button></div></form></section></main>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getDatabase, ref, push, onValue, query, limitToLast, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
  import { firebaseConfig } from './firebase-config.js';

  const status = document.querySelector('#status');
  const messages = document.querySelector('#messages');
  const form = document.querySelector('#chat-form');
  const nameInput = document.querySelector('#name');
  const messageInput = document.querySelector('#message');
  const savedName = localStorage.getItem('dragonChatName');
  if (savedName) nameInput.value = savedName;
  document.querySelector('#save-name').addEventListener('click', () => localStorage.setItem('dragonChatName', nameInput.value.trim()));

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');
    const latestMessages = query(messagesRef, limitToLast(100));
    onValue(latestMessages, (snapshot) => {
      messages.replaceChildren();
      snapshot.forEach((childSnapshot) => {
        const data = childSnapshot.val(); const row = document.createElement('article');
        row.className = 'rounded-2xl bg-white/5 px-4 py-3';
        const author = document.createElement('strong'); author.className = 'text-sm text-red-300'; author.textContent = data.displayName || 'Anonymous dragon';
        const text = document.createElement('p'); text.className = 'mt-1 whitespace-pre-wrap text-white/80'; text.textContent = data.text || '';
        row.append(author, text); messages.append(row);
      });
      messages.scrollTop = messages.scrollHeight;
      status.textContent = 'Live — messages update in real time';
    }, () => { status.textContent = 'Chat is unavailable. Check your Firebase configuration and Firestore rules.'; });
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); const displayName = nameInput.value.trim(); const text = messageInput.value.trim();
      if (!displayName || !text) return;
      localStorage.setItem('dragonChatName', displayName);
      await push(messagesRef, { text, displayName, createdAt: serverTimestamp() });
      messageInput.value = '';
    });
  } catch (error) { status.textContent = 'Chat setup is incomplete. Add your Firebase API key and app ID in firebase-config.js.'; }
</script></body></html>
