name: Huiell Phone APK

on:
  push:
    branches:
      - huiell-phone-v1
    paths:
      - 'huiell-phone/**'
      - '.github/workflows/huiell-phone-build.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Huiell v1
        uses: actions/checkout@v4

      - name: Build Huiell arm64 APK
        run: bash huiell-phone/vercel-build.sh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Huiell-S22-v1
          path: public/Huiell-S22-v1.apk
          if-no-files-found: error
